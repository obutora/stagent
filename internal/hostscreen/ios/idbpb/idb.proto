// The part of idb_companion's gRPC API that stagent uses (ホストの画面 of an
// iOS simulator, ADR 0008), copied from facebook/idb proto/idb.proto at
// v1.6.8 (5dad098fd102142817c602de7c48d68c80099eb7, MIT). Names and field
// numbers are unchanged; everything else is left out (a companion ignores
// fields it is not sent, and stagent ignores those it is sent). Regenerate
// with `go generate` (see gen.go).

syntax = "proto3";

package idb;

option go_package = "github.com/obutora/stagent/internal/hostscreen/ios/idbpb";

// The idb companion service definition.
service CompanionService {
  rpc describe(TargetDescriptionRequest) returns (TargetDescriptionResponse) {}
  rpc hid(stream HIDEvent) returns (HIDResponse) {}
  rpc video_stream(stream VideoStreamRequest)
      returns (stream VideoStreamResponse) {}
  rpc accessibility_info(AccessibilityInfoRequest)
      returns (AccessibilityInfoResponse) {}
  rpc list_apps(ListAppsRequest) returns (ListAppsResponse) {}
}

message ListAppsRequest {
  bool suppress_process_state = 1;
}

message ListAppsResponse {
  repeated InstalledAppInfo apps = 1;
}

message InstalledAppInfo {
  string bundle_id = 1;
  string name = 2;
  repeated string architectures = 3;
  string install_type = 4;
  enum AppProcessState {
    UNKNOWN = 0;
    NOT_RUNNING = 1;
    RUNNING = 2;
  }
  AppProcessState process_state = 5;
  bool debuggable = 6;
  uint64 process_identifier = 7;
}

message AccessibilityInfoRequest {
  enum Format {
    LEGACY = 0;
    NESTED = 1;
    COMPLETE = 2;
  }
  enum Backend {
    BACKEND_UNSPECIFIED = 0;
    AX = 1;
    AXBRIDGE = 2;
    AXBRIDGE_PERSISTENT = 3;
  }
  Point point = 2;
  Format format = 3;
  uint32 depth = 6;
  // Restricts the described accessibility keys to this set; an empty list
  // returns the default key set.
  repeated string keys = 7;
  Backend backend = 8;
}

message AccessibilityInfoResponse {
  string json = 1;
}

message Payload {
  oneof source {
    string file_path = 1;
    bytes data = 2;
    string url = 3;
  }
}

message Point {
  double x = 1;
  double y = 2;
}

message TargetDescriptionRequest {
  bool fetch_diagnostics = 1;
}

message TargetDescriptionResponse {
  TargetDescription target_description = 1;
}

message HIDEvent {
  enum HIDDirection {
    DOWN = 0;
    UP = 1;
  }

  message HIDTouch {
    Point point = 1;
  }

  enum HIDButtonType {
    APPLE_PAY = 0;
    HOME = 1;
    LOCK = 2;
    SIDE_BUTTON = 3;
    SIRI = 4;
    PLAY_PAUSE = 5;
    VOLUME_UP = 6;
    VOLUME_DOWN = 7;
    EJECT = 8;
  }

  message HIDButton {
    HIDButtonType button = 1;
  }

  message HIDKey {
    uint64 keycode = 1;
  }

  message HIDPressAction {
    oneof action {
      HIDTouch touch = 1;
      HIDButton button = 2;
      HIDKey key = 3;
    }
  }

  message HIDPress {
    HIDPressAction action = 1;
    HIDDirection direction = 2;
  }

  message HIDSwipe {
    Point start = 1;
    Point end = 2;
    double delta = 5;
    double duration = 6;
  }

  message HIDDelay {
    double duration = 1;
  }

  // Experimental display-selection clients used field 7.
  reserved 7;

  oneof event {
    HIDPress press = 1;
    HIDSwipe swipe = 2;
    HIDDelay delay = 3;
  }
}

message HIDResponse {}

message ScreenDimensions {
  uint64 width = 1;
  uint64 height = 2;
  double density = 3;
  uint64 width_points = 4;
  uint64 height_points = 5;
}

message TargetDescription {
  string udid = 1;
  string name = 2;
  ScreenDimensions screen_dimensions = 3;
  string state = 4;
  string target_type = 5;
  string os_version = 6;
}

message VideoStreamRequest {
  enum Format {
    H264 = 0;
    RBGA = 1;
    MJPEG = 2;
    MINICAP = 3;
    I420 = 4;
  }
  message Start {
    string file_path = 1;
    uint64 fps = 2;
    Format format = 3;
    double compression_quality = 4;
    double scale_factor = 5;
    double avg_bitrate = 6;
    double key_frame_rate = 7;
  }
  message Stop {}
  oneof control {
    Start start = 1;
    Stop stop = 2;
  }
}

message VideoStreamResponse {
  oneof output {
    bytes log_output = 1;
    Payload payload = 2;
  }
}
